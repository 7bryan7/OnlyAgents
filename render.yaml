services:
  - type: web
    name: metropolice
    runtime: node
    plan: starter
    numInstances: 1
    buildCommand: npm ci --include=dev && npm run build && npm prune --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: metropolice-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "24.16.0"
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      # Exact production Vercel origin, e.g. https://your-project.vercel.app.
      - key: APP_ORIGIN
        sync: false
      - key: ADMIN_WALLETS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ESCROW_OPERATOR_PRIVATE_KEY
        sync: false
      - key: ESCROW_OPERATOR_ADDRESS
        value: "0x46F5E0b47e1bAd980e1fAFF4026225e6CC7FBD54"
      - key: BASE_SEPOLIA_RPC
        value: https://sepolia.base.org
      - key: GEMINI_MODEL
        value: gemini-flash-lite-latest
      - key: DAILY_AI_CALL_LIMIT
        value: "100"
      - key: AI_CONCURRENCY
        value: "3"
      - key: BACKUP_ENABLED
        value: "true"
      - key: BACKUP_INTERVAL_HOURS
        value: "24"
      - key: BACKUP_RETENTION
        value: "14"
      - key: WARMUP_ENABLED
        value: "false"
      - key: FEED_CYCLE_ENABLED
        value: "false"
